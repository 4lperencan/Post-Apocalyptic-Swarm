<svg xmlns="http://www.w3.org/2000/svg" width="830" height="990" viewBox="0 0 830 990"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#2F3E4E"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#5D6B79" font-weight="bold" font-style="normal" text-anchor="start"><tspan x="24" y="31.2">Figure 1 - Overall game flow</tspan></text><rect x="180.0" y="58.0" width="140" height="44" rx="22.0" fill="#2F3E4E" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="white" font-weight="bold" font-style="normal" text-anchor="middle"><tspan x="250" y="84.9">Start</tspan></text><rect x="100.0" y="136.0" width="300" height="60" rx="3" fill="#E8EEF4" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="250" y="161.9">Load textures, music and sounds</tspan><tspan x="250" y="179.9">Build the arena, place the player</tspan></text><rect x="100.0" y="232.0" width="300" height="60" rx="3" fill="#E8EEF4" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="250" y="257.9">Start screen</tspan><tspan x="250" y="275.9">Press ENTER to play</tspan></text><rect x="100.0" y="328.0" width="300" height="60" rx="3" fill="#E8EEF4" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="250" y="353.9">Wave = 1, score = 0, full health</tspan><tspan x="250" y="371.9">Start music</tspan></text><rect x="100.0" y="424.0" width="300" height="60" rx="3" fill="#E8EEF4" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="250" y="449.9">Start wave: spawn zombies one by one</tspan><tspan x="250" y="467.9">(4 more zombies every wave)</tspan></text><rect x="100.0" y="524.0" width="300" height="60" rx="3" fill="#E1EBDF" stroke="#2F3E4E" stroke-width="1.5"/><line x1="112.0" y1="524.0" x2="112.0" y2="584.0" stroke="#2F3E4E" stroke-width="1.5"/><line x1="388.0" y1="524.0" x2="388.0" y2="584.0" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="250" y="549.9">Game loop  (see Figure 2)</tspan><tspan x="250" y="567.9">runs until wave cleared or player dead</tspan></text><polygon points="250,627.0 365.0,672 250,717.0 135.0,672" fill="#FBEFD0" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="250" y="667.9">Player still</tspan><tspan x="250" y="685.9">alive?</tspan></text><rect x="100.0" y="762.0" width="300" height="60" rx="3" fill="#E8EEF4" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="250" y="787.9">Wave cleared: play voice line</tspan><tspan x="250" y="805.9">wave number + 1</tspan></text><rect x="485.0" y="642.0" width="250" height="60" rx="3" fill="#E8EEF4" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="610" y="667.9">Game over: stop music</tspan><tspan x="610" y="685.9">show score and wave reached</tspan></text><polygon points="610,749.0 735.0,792 610,835.0 485.0,792" fill="#FBEFD0" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="610" y="787.9">Press R to restart</tspan><tspan x="610" y="805.9">or Q to quit</tspan></text><rect x="535.0" y="856.0" width="150" height="44" rx="22.0" fill="#2F3E4E" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="white" font-weight="bold" font-style="normal" text-anchor="middle"><tspan x="610" y="882.9">Quit game</tspan></text><polyline points="250.0,102.0 250.0,136.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="250.0,196.0 250.0,232.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="250.0,292.0 250.0,328.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="250.0,388.0 250.0,424.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="250.0,484.0 250.0,524.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="250.0,584.0 250.0,627.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="250.0,717.0 250.0,762.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="italic" text-anchor="middle"><tspan x="266" y="741.2">yes</tspan></text><polyline points="365.0,672.0 485.0,672.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="italic" text-anchor="middle"><tspan x="395.0" y="668.2">no</tspan></text><polyline points="610.0,702.0 610.0,749.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="610.0,835.0 610.0,856.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="italic" text-anchor="middle"><tspan x="624" y="853.2">Q</tspan></text><polyline points="100.0,792.0 52.0,792.0 52.0,454.0 100.0,454.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="italic" text-anchor="middle" transform="rotate(-90 40.0 640)"><tspan x="40.0" y="644.2">next wave, no break</tspan></text><polyline points="735.0,792.0 790.0,792.0 790.0,358.0 400.0,358.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="italic" text-anchor="middle"><tspan x="755.0" y="788.2">R</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="italic" text-anchor="middle" transform="rotate(-90 804 560)"><tspan x="804" y="564.2">restart</tspan></text><rect x="40" y="945" width="44" height="20" rx="10" fill="#2F3E4E" stroke="#2F3E4E"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="normal" text-anchor="start"><tspan x="94" y="959.2">Start / end</tspan></text><rect x="190" y="945" width="44" height="20" rx="2" fill="#E8EEF4" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="normal" text-anchor="start"><tspan x="244" y="959.2">Step</tspan></text><polygon points="322,943 344,955 322,967 300,955" fill="#FBEFD0" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="normal" text-anchor="start"><tspan x="354" y="959.2">Decision</tspan></text><rect x="430" y="945" width="44" height="20" rx="2" fill="#E1EBDF" stroke="#2F3E4E" stroke-width="1.5"/><line x1="437" y1="945" x2="437" y2="965" stroke="#2F3E4E" stroke-width="1.5"/><line x1="467" y1="945" x2="467" y2="965" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="normal" text-anchor="start"><tspan x="484" y="959.2">Sub-process</tspan></text></svg>