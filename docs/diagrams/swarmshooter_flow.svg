<svg xmlns="http://www.w3.org/2000/svg" width="830" height="930" viewBox="0 0 830 930"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#2F3E4E"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#5D6B79" font-weight="bold" font-style="normal" text-anchor="start"><tspan x="24" y="31.2">Figure 1 - Overall game flow</tspan></text><rect x="180.0" y="58.0" width="140" height="44" rx="22.0" fill="#2F3E4E" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="white" font-weight="bold" font-style="normal" text-anchor="middle"><tspan x="250" y="84.9">Start</tspan></text><rect x="100.0" y="130.0" width="300" height="60" rx="3" fill="#E8EEF4" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="250" y="155.9">Main menu</tspan><tspan x="250" y="173.9">Play / Quit</tspan></text><polygon points="250,219.0 375.0,262 250,305.0 125.0,262" fill="#FBEFD0" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="250" y="257.9">Player chose</tspan><tspan x="250" y="275.9">Play?</tspan></text><rect x="535.0" y="240.0" width="150" height="44" rx="22.0" fill="#2F3E4E" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="white" font-weight="bold" font-style="normal" text-anchor="middle"><tspan x="610" y="266.9">Quit game</tspan></text><rect x="100.0" y="346.0" width="300" height="60" rx="3" fill="#E8EEF4" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="250" y="371.9">Load assets and build the arena</tspan><tspan x="250" y="389.9">Place player, score = 0, wave = 1</tspan></text><rect x="100.0" y="436.0" width="300" height="60" rx="3" fill="#E8EEF4" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="250" y="461.9">Start wave: spawn enemies</tspan><tspan x="250" y="479.9">(more enemies every wave)</tspan></text><rect x="100.0" y="536.0" width="300" height="60" rx="3" fill="#E1EBDF" stroke="#2F3E4E" stroke-width="1.5"/><line x1="112.0" y1="536.0" x2="112.0" y2="596.0" stroke="#2F3E4E" stroke-width="1.5"/><line x1="388.0" y1="536.0" x2="388.0" y2="596.0" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="250" y="561.9">Game loop  (see Figure 2)</tspan><tspan x="250" y="579.9">runs until wave cleared or player dead</tspan></text><polygon points="250,639.0 365.0,684 250,729.0 135.0,684" fill="#FBEFD0" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="250" y="679.9">Player still</tspan><tspan x="250" y="697.9">alive?</tspan></text><rect x="100.0" y="774.0" width="300" height="60" rx="3" fill="#E8EEF4" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="250" y="799.9">Wave cleared: short break</tspan><tspan x="250" y="817.9">wave number + 1</tspan></text><rect x="485.0" y="654.0" width="250" height="60" rx="3" fill="#E8EEF4" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="610" y="679.9">Game over</tspan><tspan x="610" y="697.9">show score and wave reached</tspan></text><polyline points="250.0,102.0 250.0,130.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="250.0,190.0 250.0,219.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="250.0,305.0 250.0,346.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="italic" text-anchor="middle"><tspan x="266" y="327.2">yes</tspan></text><polyline points="375.0,262.0 535.0,262.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="italic" text-anchor="middle"><tspan x="411.0" y="258.2">no</tspan></text><polyline points="250.0,406.0 250.0,436.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="250.0,496.0 250.0,536.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="250.0,596.0 250.0,639.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="250.0,729.0 250.0,774.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="italic" text-anchor="middle"><tspan x="266" y="753.2">yes</tspan></text><polyline points="365.0,684.0 485.0,684.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="italic" text-anchor="middle"><tspan x="395.0" y="680.2">no</tspan></text><polyline points="100.0,804.0 52.0,804.0 52.0,466.0 100.0,466.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="italic" text-anchor="middle" transform="rotate(-90 40.0 640)"><tspan x="40.0" y="644.2">next wave</tspan></text><polyline points="735.0,684.0 790.0,684.0 790.0,160.0 400.0,160.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="italic" text-anchor="middle" transform="rotate(-90 804 420)"><tspan x="804" y="424.2">back to menu</tspan></text><rect x="40" y="880" width="44" height="20" rx="10" fill="#2F3E4E" stroke="#2F3E4E"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="normal" text-anchor="start"><tspan x="94" y="894.2">Start / end</tspan></text><rect x="190" y="880" width="44" height="20" rx="2" fill="#E8EEF4" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="normal" text-anchor="start"><tspan x="244" y="894.2">Step</tspan></text><polygon points="322,878 344,890 322,902 300,890" fill="#FBEFD0" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="normal" text-anchor="start"><tspan x="354" y="894.2">Decision</tspan></text><rect x="430" y="880" width="44" height="20" rx="2" fill="#E1EBDF" stroke="#2F3E4E" stroke-width="1.5"/><line x1="437" y1="880" x2="437" y2="900" stroke="#2F3E4E" stroke-width="1.5"/><line x1="467" y1="880" x2="467" y2="900" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="normal" text-anchor="start"><tspan x="484" y="894.2">Sub-process</tspan></text></svg>