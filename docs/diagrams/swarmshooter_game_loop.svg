<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1426" viewBox="0 0 880 1426"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#2F3E4E"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#5D6B79" font-weight="bold" font-style="normal" text-anchor="start"><tspan x="24" y="31.2">Figure 2 - Game loop (one frame, 60 times per second)</tspan></text><rect x="190.0" y="70.0" width="180" height="44" rx="22.0" fill="#2F3E4E" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="white" font-weight="bold" font-style="normal" text-anchor="middle"><tspan x="280" y="96.9">Enter game loop</tspan></text><rect x="130.0" y="144.0" width="300" height="78" rx="3" fill="#E8EEF4" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="280" y="169.9">Read input</tspan><tspan x="280" y="187.9">WASD: move direction</tspan><tspan x="280" y="205.9">Mouse: aim, left click: shoot</tspan></text><rect x="130.0" y="252.0" width="300" height="60" rx="3" fill="#E8EEF4" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="280" y="277.9">Move the player and rotate</tspan><tspan x="280" y="295.9">toward the mouse position</tspan></text><polygon points="280,342.0 405.0,385.0 280,428.0 155.0,385.0" fill="#FBEFD0" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="280" y="380.9">Player inside</tspan><tspan x="280" y="398.9">a wall?</tspan></text><polygon points="280,458.0 405.0,501.0 280,544.0 155.0,501.0" fill="#FBEFD0" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="280" y="496.9">Shoot button</tspan><tspan x="280" y="514.9">pressed?</tspan></text><rect x="130.0" y="574.0" width="300" height="60" rx="3" fill="#E8EEF4" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="280" y="599.9">Move bullets, spawn the next zombie</tspan><tspan x="280" y="617.9">zombies walk toward the player</tspan></text><polygon points="280,664.0 405.0,707.0 280,750.0 155.0,707.0" fill="#FBEFD0" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="280" y="702.9">Any bullet</tspan><tspan x="280" y="720.9">hits a wall?</tspan></text><polygon points="280,780.0 405.0,823.0 280,866.0 155.0,823.0" fill="#FBEFD0" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="280" y="818.9">Any bullet</tspan><tspan x="280" y="836.9">hits a zombie?</tspan></text><polygon points="280,896.0 405.0,939.0 280,982.0 155.0,939.0" fill="#FBEFD0" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="280" y="934.9">Any zombie touches</tspan><tspan x="280" y="952.9">the player?</tspan></text><polygon points="280,1012.0 405.0,1055.0 280,1098.0 155.0,1055.0" fill="#FBEFD0" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="280" y="1050.9">Player dead or</tspan><tspan x="280" y="1068.9">wave cleared?</tspan></text><rect x="130.0" y="1128.0" width="300" height="60" rx="3" fill="#E8EEF4" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="280" y="1153.9">Camera follows the player,</tspan><tspan x="280" y="1171.9">stays inside the map</tspan></text><rect x="130.0" y="1218.0" width="300" height="78" rx="3" fill="#E8EEF4" stroke="#2F3E4E" stroke-width="1.5"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2F3E4E" font-weight="normal" font-style="normal" text-anchor="middle"><tspan x="280" y="1243.9">Draw floor, player, bullets, zombies,</tspan><tspan x="280" y="1261.9">walls, HUD and score on canvas</tspan><tspan x="280" y="1279.9">Scale canvas to the window</tspan></text><polyline points="280.0,114.0 280.0,144.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="280.0,222.0 280.0,252.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="280.0,312.0 280.0,342.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="280.0,428.0 280.0,458.0" fill="none" stroke="#2F3E4E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr)"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6B79" font-weight="normal" font-style="italic" text-anchor="end"><tspan x="270" y="452.2">no</tspan></text><rect x="525.0" y="355.0" width="270" height="60" rx="3" fill="#E8EEF4" stroke="#2F3E4E"